{{ $projects := where .Site.RegularPages "Section" "projects" }}
<div class="hero-stats">
  <div class="stat-card"><span class="stat-value">{{ len $projects }}</span><span class="stat-label">Projects Tracked</span></div>
  <div class="stat-card"><span class="stat-value">{{ len site.Data.project_support }}</span><span class="stat-label">Support Routes Checked</span></div>
  <div class="stat-card"><span class="stat-value">{{ len (where .Site.RegularPages "Section" "maintainers") }}</span><span class="stat-label">People Profiled</span></div>
</div>
