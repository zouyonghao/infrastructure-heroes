<div class="projects-filter">
    <div class="filter-row">
        <div class="filter-search">
            <svg class="filter-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input type="text" id="project-search" placeholder="Search projects by name or description..." class="filter-input" aria-label="Search projects by name or description">
            <button id="clear-search" class="filter-clear" title="Clear search" aria-label="Clear search" style="display: none;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <select id="health-filter" class="filter-select" aria-label="Filter projects by support information">
            <option value="">All projects</option>
            <option value="support">Support links checked</option>
            <option value="unreviewed">Support links not yet checked</option>
        </select>

        <select id="sort-by" class="filter-select" aria-label="Sort projects">
            <option value="name-asc">Name: A to Z</option>
            <option value="name-desc">Name: Z to A</option>
        </select>

        <button id="reset-filters" class="filter-reset">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"></path>
                <path d="M3 3v9h9"></path>
            </svg>
            Reset
        </button>
    </div>

    <div class="filter-stats" role="status" aria-live="polite">
        <span id="filter-results">Showing <strong id="visible-count">{{ len (where .Site.RegularPages "Section" "projects") }}</strong> <span id="results-label">projects</span></span>
        <span id="active-filters" class="active-filters" style="display: none;"></span>
    </div>
</div>

<div id="no-results" class="no-results" style="display: none;">
    <div class="no-results-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
            <line x1="8" y1="8" x2="14" y2="14"></line>
            <line x1="14" y1="8" x2="8" y2="14"></line>
        </svg>
    </div>
    <h2 class="no-results-title">No projects found</h2>
    <p>Try adjusting your search or filters to find what you're looking for.</p>
    <button id="no-results-reset" class="btn btn-secondary">Clear all filters</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    'use strict';

    // Elements
    const searchInput = document.getElementById('project-search');
    const healthFilter = document.getElementById('health-filter');
    const sortBy = document.getElementById('sort-by');
    const resetBtn = document.getElementById('reset-filters');
    const clearSearchBtn = document.getElementById('clear-search');
    const visibleCount = document.getElementById('visible-count');
    const resultsLabel = document.getElementById('results-label');
    const activeFiltersEl = document.getElementById('active-filters');
    const noResults = document.getElementById('no-results');
    const noResultsReset = document.getElementById('no-results-reset');
    const projectsGrid = document.querySelector('.projects-grid');

    if (!projectsGrid) return;

    // Get all project cards
    const projectCards = Array.from(document.querySelectorAll('.project-card'));

    // Read the values we filter/sort on once, up front, instead of on every comparison.
    const cardData = new Map();
    projectCards.forEach(function(card) {
        cardData.set(card, {
            title: (card.querySelector('.project-title')?.textContent || '').toLowerCase(),
            description: (card.querySelector('.project-description')?.textContent || '').toLowerCase(),
            health: card.dataset.health || ''
        });
    });

    // Debounce function for search
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(function() { func(...args); }, wait);
        };
    }

    // Update active filters display.
    // textContent only: filter values come from the URL hash, so HTML must never be parsed.
    function updateActiveFilters() {
        const filters = [];

        if (searchInput.value.trim()) {
            filters.push('Search: "' + searchInput.value.trim() + '"');
        }

        if (healthFilter.value) {
            const healthText = healthFilter.options[healthFilter.selectedIndex].text;
            filters.push('Support: ' + healthText);
        }

        if (filters.length > 0) {
            activeFiltersEl.textContent = ' • Filtered by: ' + filters.join(', ');
            activeFiltersEl.style.display = 'inline';
        } else {
            activeFiltersEl.textContent = '';
            activeFiltersEl.style.display = 'none';
        }
    }

    // Sort projects using the cached card data (no repeated DOM queries)
    function sortProjects(cards, sortValue) {
        const sorted = cards.slice();

        sorted.sort(function(a, b) {
            const da = cardData.get(a);
            const db = cardData.get(b);

            switch (sortValue) {
                case 'name-desc':
                    return db.title.localeCompare(da.title);
                case 'name-asc':
                default:
                    return da.title.localeCompare(db.title);
            }
        });

        // Re-append in sorted order
        sorted.forEach(function(item) {
            if (item.style.display !== 'none') {
                projectsGrid.appendChild(item);
            }
        });
    }

    // Filter projects
    function filterProjects() {
        const searchTerm = searchInput.value.toLowerCase().trim();
        const healthValue = healthFilter.value;
        let visible = 0;

        // Show/hide clear search button
        clearSearchBtn.style.display = searchTerm ? 'flex' : 'none';

        projectCards.forEach(function(card) {
            const data = cardData.get(card);

            const matchesSearch = !searchTerm || data.title.includes(searchTerm) || data.description.includes(searchTerm);
            const matchesHealth = !healthValue || data.health === healthValue;

            if (matchesSearch && matchesHealth) {
                card.style.display = '';
                visible++;
            } else {
                card.style.display = 'none';
            }
        });

        // Sort visible projects
        sortProjects(projectCards, sortBy.value);

        // Update UI
        visibleCount.textContent = visible;
        resultsLabel.textContent = visible === 1 ? 'project' : 'projects';
        updateActiveFilters();

        // Show/hide no results message
        if (visible === 0) {
            projectsGrid.style.display = 'none';
            noResults.style.display = 'block';
        } else {
            projectsGrid.style.display = 'grid';
            noResults.style.display = 'none';
        }

        // Store filters in URL hash for persistence
        updateUrlHash();
    }

    // Update URL hash with current filters
    function updateUrlHash() {
        const params = new URLSearchParams();

        if (searchInput.value.trim()) {
            params.set('search', searchInput.value.trim());
        }

        if (healthFilter.value) {
            params.set('health', healthFilter.value);
        }

        if (sortBy.value !== 'name-asc') {
            params.set('sort', sortBy.value);
        }

        const hash = params.toString();
        if (hash) {
            history.replaceState(null, null, '#' + hash);
        } else {
            history.replaceState(null, null, window.location.pathname + window.location.search);
        }
    }

    // Load filters from URL hash
    function loadFiltersFromHash() {
        const hash = window.location.hash.slice(1);
        if (!hash) return;

        const params = new URLSearchParams(hash);

        if (params.has('search')) {
            searchInput.value = params.get('search');
        }

        if (params.has('health')) {
            healthFilter.value = params.get('health');
        }

        if (params.has('sort')) {
            sortBy.value = params.get('sort');
        }

        filterProjects();
    }

    // Event listeners
    const debouncedFilter = debounce(filterProjects, 150);

    searchInput?.addEventListener('input', debouncedFilter);
    healthFilter?.addEventListener('change', filterProjects);
    sortBy?.addEventListener('change', filterProjects);

    clearSearchBtn?.addEventListener('click', function() {
        searchInput.value = '';
        searchInput.focus();
        filterProjects();
    });

    function resetAllFilters() {
        searchInput.value = '';
        healthFilter.value = '';
        sortBy.value = 'name-asc';
        clearSearchBtn.style.display = 'none';
        filterProjects();
    }

    resetBtn?.addEventListener('click', resetAllFilters);
    noResultsReset?.addEventListener('click', resetAllFilters);

    // Load filters on page load
    loadFiltersFromHash();

    // Handle hash changes
    window.addEventListener('hashchange', loadFiltersFromHash);
});
</script>
